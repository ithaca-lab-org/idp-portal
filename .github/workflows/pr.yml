name: pr

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:8.0@sha256:4a4ab5d4834207389e0d7270fac988e21ffedccecba77991a552f755df229907
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l api)" || { gofmt -l api; exit 1; }
      - name: vet
        working-directory: api
        run: go vet ./...
      - name: test (includes the MongoDB store tests against the service container)
        working-directory: api
        env:
          MONGO_TEST_URI: mongodb://localhost:27017
        run: go test -race -count=1 ./...
      - name: vulnerability scan
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l operator)" || { gofmt -l operator; exit 1; }
      - name: generated files are up to date, vet, tests (envtest), vulnerabilities
        working-directory: operator
        run: |
          make test
          git diff --exit-code -- config api
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: yamllint
        run: |
          pip install --quiet yamllint==1.37.1
          yamllint --strict .

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

name: pr

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      mongo:
        # MongoDB 8.x refuses to start on Linux 6.19+ runners (SERVER-121912, tcmalloc and the kernel's
        # rseq area; the startup check cannot be bypassed). 7.0 is not affected. Production runs 8.0
        # (idp-gitops); move this back to 8.x once MongoDB ships a fixed image.
        image: mongo:7.0@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: runner kernel (for diagnosing MongoDB start failures, SERVER-121912)
        run: uname -r
      - name: gofmt
        run: test -z "$(gofmt -l api)" || { gofmt -l api; exit 1; }
      - name: vet
        working-directory: api
        run: go vet ./...
      - name: test (includes the MongoDB store tests against the service container)
        working-directory: api
        env:
          MONGO_TEST_URI: mongodb://localhost:27017
        run: go test -race -count=1 ./...
      - name: vulnerability scan
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: install (no lifecycle scripts)
        working-directory: web
        run: npm ci --ignore-scripts
      - name: typecheck, component tests, build
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  notifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: notifier/go.mod
          cache-dependency-path: notifier/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l notifier)" || { gofmt -l notifier; exit 1; }
      - name: vet, tests, vulnerabilities
        working-directory: notifier
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  operator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l operator)" || { gofmt -l operator; exit 1; }
      - name: generated files are up to date, vet, tests (envtest), vulnerabilities
        working-directory: operator
        run: |
          make test
          git diff --exit-code -- config api
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: yamllint
        run: |
          pip install --quiet yamllint==1.37.1
          yamllint --strict .

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

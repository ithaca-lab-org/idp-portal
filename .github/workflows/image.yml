name: image

# Pull requests: build and scan only (no cloud access). Push to main: build, scan, then push to
# Artifact Registry through Workload Identity Federation (no keys).
on:
  pull_request:
    branches: [main]
    paths: [Dockerfile, .dockerignore, api/**, operator/**, .github/workflows/image.yml]
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, api/**, operator/**, .github/workflows/image.yml]

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: us-central1-docker.pkg.dev
  IMAGE_PREFIX: us-central1-docker.pkg.dev/project-324502ff-9928-4b17-a89/idp

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: portal-api, context: ., file: Dockerfile}
          - {image: idp-operator, context: operator, file: operator/Dockerfile}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          load: true
          push: false
          provenance: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: scan (fails on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  push:
    # Only this job can mint the Google identity (id-token: write), and only on pushes to main.
    # The registry binding also pins this exact workflow file, see idp-infra bootstrap/.
    if: github.event_name == 'push'
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: portal-api, context: ., file: Dockerfile}
          - {image: idp-operator, context: operator, file: operator/Dockerfile}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PUSH_SA }}
          token_format: access_token
      - name: log in to Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
      - name: summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          NAME: ${{ matrix.image }}
        run: echo "pushed ${IMAGE_PREFIX}/${NAME}:${GITHUB_SHA} (${DIGEST})" >> "$GITHUB_STEP_SUMMARY"

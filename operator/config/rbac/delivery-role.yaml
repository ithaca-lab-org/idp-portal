---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idp-delivery
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - idp.ithaca-idp.com
  resources:
  - deliverypipelines
  - deliveryruns
  - workloadidentities
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - idp.ithaca-idp.com
  resources:
  - deliverypipelines/status
  - deliveryruns/status
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idp-delivery
  namespace: idp-system
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - update

# Confines the idp-operator ServiceAccount to the namespaces it manages.
# RBAC cannot scope namespace or child writes by label; this policy does.
# Only requests from the operator's ServiceAccount are evaluated (matchConditions),
# so other users pay nothing beyond the resource match.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: idp-operator-scope
spec:
  failurePolicy: Fail
  matchConstraints:
    # Subresources are matched too (namespaces/finalize, namespaces/status, ...)
    # so that a later RBAC change cannot open a side door. DELETE also covers
    # deletecollection: the apiserver admits each item as a separate DELETE.
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["namespaces", "namespaces/*", "resourcequotas", "resourcequotas/*", "limitranges", "limitranges/*",
                    "serviceaccounts", "serviceaccounts/*"]
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["networkpolicies", "networkpolicies/*"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["rolebindings", "rolebindings/*"]
      # VSO VaultAuth (VAULT_ENABLED=true). Harmless while the CRD is absent.
      - apiGroups: ["secrets.hashicorp.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["vaultauths", "vaultauths/*"]
      # VSO VaultStaticSecret for ManagedSecrets (VAULT_ENABLED=true).
      - apiGroups: ["secrets.hashicorp.com"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["vaultstaticsecrets", "vaultstaticsecrets/*"]
      # WorkloadIdentity children (Gateway API and Istio CRDs).
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["httproutes", "httproutes/*"]
      - apiGroups: ["security.istio.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["authorizationpolicies", "authorizationpolicies/*"]
      # The platform wildcard Certificate: only its spec.dnsNames may be updated.
      - apiGroups: ["cert-manager.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["certificates", "certificates/*"]
  matchConditions:
    - name: is-idp-operator
      expression: "request.userInfo.username == 'system:serviceaccount:idp-system:idp-operator'"
  variables:
    - name: isNamespace
      expression: "request.resource.resource == 'namespaces'"
    # Both labels, and the team-namespace label must equal the namespace name
    # (the operator always names the namespace after its TeamNamespace).
    - name: newOwned
      expression: >-
        request.operation != 'DELETE' && variables.isNamespace &&
        has(object.metadata.labels) &&
        object.metadata.labels[?'app.kubernetes.io/managed-by'] == optional.of('idp-operator') &&
        object.metadata.labels[?'idp.ithaca-idp.com/team-namespace'] == optional.of(object.metadata.name)
    # oldObject is the stored object, so a label added in the same request cannot
    # make an unmanaged namespace adoptable.
    - name: oldOwned
      expression: >-
        request.operation != 'CREATE' && variables.isNamespace &&
        has(oldObject.metadata.labels) &&
        oldObject.metadata.labels[?'app.kubernetes.io/managed-by'] == optional.of('idp-operator') &&
        oldObject.metadata.labels[?'idp.ithaca-idp.com/team-namespace'] == optional.of(oldObject.metadata.name)
    # namespaceObject is null for cluster-scoped kinds and comes from the apiserver's
    # namespace informer for namespaced kinds.
    - name: parentOwned
      expression: >-
        namespaceObject != null && has(namespaceObject.metadata.labels) &&
        namespaceObject.metadata.labels[?'app.kubernetes.io/managed-by'] == optional.of('idp-operator') &&
        namespaceObject.metadata.labels[?'idp.ithaca-idp.com/team-namespace'] == optional.of(namespaceObject.metadata.name)
    - name: isCert
      expression: "request.resource.group == 'cert-manager.io' && request.resource.resource == 'certificates'"
    - name: isVSS
      expression: "request.resource.resource == 'vaultstaticsecrets'"
    # Objects named after a WorkloadIdentity: all HTTPRoutes and
    # AuthorizationPolicies, and ServiceAccounts and VaultAuths other than the
    # TeamNamespace child vault-reader (a reserved WorkloadIdentity name).
    - name: isWI
      expression: >-
        request.resource.resource in ['httproutes', 'authorizationpolicies'] ||
        (request.resource.resource in ['serviceaccounts', 'vaultauths'] && request.name != 'vault-reader')
  validations:
    - expression: >-
        !variables.isNamespace ||
        (request.operation == 'CREATE' ? variables.newOwned :
         request.operation == 'UPDATE' ? variables.oldOwned && variables.newOwned :
         variables.oldOwned)
      reason: Forbidden
      messageExpression: >-
        'idp-operator may only ' + request.operation + ' namespaces labelled app.kubernetes.io/managed-by=idp-operator and idp.ithaca-idp.com/team-namespace=<name>, and may not change those labels (namespace ' + request.name + ')'
    # Mirrors the reserved names in internal/controller/resources.go; stops a
    # compromised operator from pre-creating namespaces that platform components
    # will later deploy into.
    - expression: >-
        !variables.isNamespace || request.operation != 'CREATE' ||
        (!(request.name in ['default', 'argocd', 'cert-manager', 'tailscale', 'identity', 'idp-system', 'echo', 'vault', 'spinnaker', 'keycloak']) &&
         !['kube-', 'istio-', 'gke-', 'vault-'].exists(p, request.name.startsWith(p)))
      reason: Forbidden
      messageExpression: "'idp-operator may not create reserved namespace ' + request.name"
    # Without this, the operator could relax Pod Security on a namespace it owns.
    - expression: >-
        !variables.isNamespace || request.operation == 'DELETE' ||
        object.metadata.labels[?'pod-security.kubernetes.io/enforce'].orValue('') in ['baseline', 'restricted']
      reason: Forbidden
      message: "idp-operator must keep pod-security.kubernetes.io/enforce at baseline or restricted"
    # Namespace labels are exactly the keys namespaceLabels() writes
    # (internal/controller/resources.go) plus the one the apiserver adds. istio.io/dataplane-mode=ambient
    # keeps ztunnel mTLS and AuthorizationPolicy enforcement on, gateway-access=allowed is
    # what the allow-ingress-gateway and allowedRoutes selectors see; any other key
    # (istio.io/use-waypoint, istio.io/rev, istio-injection, a label another
    # namespace's selector matches) is denied. Keep in step with namespaceLabels().
    - expression: >-
        !variables.isNamespace || request.operation == 'DELETE' ||
        (object.metadata.labels[?'istio.io/dataplane-mode'] == optional.of('ambient') &&
         object.metadata.labels[?'ithaca.idp/gateway-access'] == optional.of('allowed') &&
         object.metadata.labels.all(k, k in ['app.kubernetes.io/managed-by', 'idp.ithaca-idp.com/team-namespace',
           'idp.ithaca-idp.com/business-unit', 'istio.io/dataplane-mode', 'ithaca.idp/gateway-access',
           'pod-security.kubernetes.io/enforce', 'pod-security.kubernetes.io/warn', 'kubernetes.io/metadata.name']))
      reason: Forbidden
      message: "idp-operator namespace labels must include istio.io/dataplane-mode=ambient and ithaca.idp/gateway-access=allowed and only the label keys the controller writes"
    - expression: "variables.isNamespace || variables.isCert || variables.parentOwned"
      reason: Forbidden
      messageExpression: >-
        'idp-operator may only write ' + request.resource.resource + ' in namespaces labelled app.kubernetes.io/managed-by=idp-operator (namespace ' + request.namespace + ')'
    # Child names are fixed in the controller; pinning them stops extra objects
    # (e.g. an allow-all NetworkPolicy) from being added next to the managed ones.
    - expression: >-
        variables.isNamespace || variables.isCert || variables.isVSS || variables.isWI ||
        request.name in {
          'resourcequotas': ['idp-quota'],
          'limitranges': ['idp-limits'],
          'networkpolicies': ['idp-default-deny-ingress', 'idp-allow-same-namespace', 'idp-allow-ingress-gateway'],
          'rolebindings': ['idp-namespace-admin', 'spinnaker-deployer'],
          'serviceaccounts': ['vault-reader'],
          'vaultauths': ['vault-reader']
        }[request.resource.resource]
      reason: Forbidden
      messageExpression: "'idp-operator may not write ' + request.resource.resource + ' named ' + request.name"
    # The tenant certificate (ADR 0009, option 2b): the one Certificate
    # istio-ingress/wildcard-apps (the Gateway's only certificateRef), UPDATE
    # only, never CREATE, DELETE or a subresource. The Certificate lives in a
    # platform namespace, so the managed-namespace rule above does not apply.
    - expression: >-
        !variables.isCert ||
        (request.operation == 'UPDATE' && request.?subResource.orValue('') == '' &&
         request.name == 'wildcard-apps' && request.namespace == 'istio-ingress')
      reason: Forbidden
      message: "idp-operator may only UPDATE the Certificate istio-ingress/wildcard-apps (no create, delete or subresource)"
    # Everything but spec.dnsNames is unchanged: other spec fields (issuerRef,
    # secretName, commonName, ...) compared key by key in both directions, so a
    # field added by a later cert-manager release is covered too (dyn() lets
    # the comprehension range over the typed spec), and labels, annotations,
    # ownerReferences and finalizers.
    - expression: >-
        !variables.isCert || request.operation != 'UPDATE' ||
        (has(object.spec) && has(oldObject.spec) &&
         object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}) &&
         object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({}) &&
         object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([]) &&
         object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]) &&
         dyn(object.spec).all(k, k == 'dnsNames' || (k in dyn(oldObject.spec) && dyn(object.spec)[k] == dyn(oldObject.spec)[k])) &&
         dyn(oldObject.spec).all(k, k == 'dnsNames' || k in dyn(object.spec)))
      reason: Forbidden
      message: "idp-operator may change only spec.dnsNames of the tenant Certificate"
    # dnsNames: [0] is the platform wildcard, every other entry is
    # *.<label>.apps.ithaca-idp.com with ONE label of at most 40 characters that
    # is not a reserved namespace name (same list as for namespaces), no
    # duplicates, at most 100 entries (Let's Encrypt). The literals follow
    # --workload-hostname-suffix; change both together.
    - expression: >-
        !variables.isCert || request.operation != 'UPDATE' ||
        (object.spec.?dnsNames.orValue([]).size() >= 1 && object.spec.?dnsNames.orValue([]).size() <= 100 &&
         object.spec.dnsNames[0] == '*.apps.ithaca-idp.com' &&
         object.spec.dnsNames.all(a, object.spec.dnsNames.exists_one(b, a == b)) &&
         object.spec.dnsNames.all(n, n == '*.apps.ithaca-idp.com' ||
           (n.matches('^[*][.][a-z0-9]([-a-z0-9]*[a-z0-9])?[.]apps[.]ithaca-idp[.]com$') &&
            [n.substring(2, n.size() - '.apps.ithaca-idp.com'.size())].all(l, l.size() <= 40 &&
              !(l in ['default', 'argocd', 'cert-manager', 'tailscale', 'identity', 'idp-system', 'echo', 'vault', 'spinnaker', 'keycloak']) &&
              !['kube-', 'istio-', 'gke-', 'vault-'].exists(p, l.startsWith(p))))))
      reason: Forbidden
      message: "idp-operator Certificate dnsNames must be *.apps.ithaca-idp.com first, then only *.<namespace>.apps.ithaca-idp.com for non-reserved single labels of at most 40 characters, no duplicates, at most 100 names"
    # idp-namespace-admin: one User subject that looks like an email: no Groups,
    # no ServiceAccounts, and no 'system:' users (a ServiceAccount can also be
    # named as a User system:serviceaccount:<ns>:<name>).
    # spinnaker-deployer (SPINNAKER_DEPLOYER_ENABLED): exactly ClusterRole
    # idp-spinnaker-deployer for the one ServiceAccount spinnaker/clouddriver,
    # nothing else (no other roleRef or subject, and the admin name cannot carry it).
    - expression: >-
        request.resource.resource != 'rolebindings' || request.operation == 'DELETE' ||
        (request.name == 'spinnaker-deployer' ?
          (object.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
           object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'idp-spinnaker-deployer' &&
           has(object.subjects) && size(object.subjects) == 1 &&
           object.subjects.all(s, s.kind == 'ServiceAccount' && s.name == 'clouddriver' &&
             s.?namespace.orValue('') == 'spinnaker' && s.?apiGroup.orValue('') == '')) :
          (object.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
           object.roleRef.kind == 'ClusterRole' && object.roleRef.name == 'admin' &&
           has(object.subjects) && size(object.subjects) == 1 &&
           object.subjects.all(s, s.kind == 'User' && !s.name.startsWith('system:') && s.name.contains('@'))))
      reason: Forbidden
      message: "idp-operator RoleBindings must bind ClusterRole admin to exactly one User subject (no groups, service accounts or system: users), or (spinnaker-deployer) ClusterRole idp-spinnaker-deployer to exactly ServiceAccount spinnaker/clouddriver"
    # The VaultAuth is pinned to exactly the spec the controller writes
    # (vaultAuthSpec): vault-reader can only log in as the namespace's own
    # vault-reader with role ns-reader, and a WorkloadIdentity's VaultAuth <name>
    # only as the ServiceAccount <name> with role workload-reader, through the
    # shared connection, never as another ServiceAccount, role, method, Vault
    # namespace or with extra headers/params. Field names follow the VSO 1.6.2
    # VaultAuth CRD.
    - expression: >-
        request.resource.resource != 'vaultauths' || request.operation == 'DELETE' ||
        (has(object.spec) && has(object.spec.kubernetes) &&
         object.spec.?method.orValue('') == 'kubernetes' &&
         object.spec.?mount.orValue('') == 'kubernetes' &&
         object.spec.?vaultConnectionRef.orValue('') == 'vault-secrets-operator/idp-vault' &&
         (object.metadata.name == 'vault-reader' ?
           object.spec.kubernetes.?role.orValue('') == 'ns-reader' &&
           object.spec.kubernetes.?serviceAccount.orValue('') == 'vault-reader' :
           object.spec.kubernetes.?role.orValue('') == 'workload-reader' &&
           object.spec.kubernetes.?serviceAccount.orValue('') == object.metadata.name) &&
         object.spec.kubernetes.?audiences.orValue([]) == ['vault'] &&
         object.spec.kubernetes.?tokenExpirationSeconds.orValue(0) == 600 &&
         !has(object.spec.allowedNamespaces) && !has(object.spec.headers) && !has(object.spec.params) &&
         !has(object.spec.namespace) && !has(object.spec.appRole) && !has(object.spec.aws) &&
         !has(object.spec.gcp) && !has(object.spec.jwt) && !has(object.spec.storageEncryption) &&
         !has(object.spec.vaultAuthGlobalRef))
      reason: Forbidden
      message: "idp-operator VaultAuths must match the operator's fixed spec (kubernetes auth as vault-reader with role ns-reader, or as ServiceAccount <name> with role workload-reader; connection vault-secrets-operator/idp-vault, audience vault, 600s tokens, no other fields)"
    # VaultStaticSecret names follow the ManagedSecrets, so they cannot be listed
    # here. Instead the object must be controlled by a ManagedSecret of the same
    # name (one ownerReference, controller=true), and on UPDATE the stored object
    # must already be, so a VaultStaticSecret made by hand or by another
    # controller can never be adopted (the controller also leaves those alone and
    # reports NameConflict). The policy cannot look the ManagedSecret up: an
    # ownerReference with a made-up UID passes here, but the garbage collector
    # deletes dependents whose owner UID does not exist.
    - expression: >-
        !variables.isVSS ||
        (request.operation == 'DELETE' ? [oldObject] : request.operation == 'UPDATE' ? [object, oldObject] : [object]).all(v,
          has(v.metadata.ownerReferences) && size(v.metadata.ownerReferences) == 1 &&
          v.metadata.ownerReferences.all(o,
            o.apiVersion == 'idp.ithaca-idp.com/v1alpha1' && o.kind == 'ManagedSecret' &&
            o.name == v.metadata.name && o.?controller.orValue(false) == true))
      reason: Forbidden
      messageExpression: "'idp-operator VaultStaticSecrets must be (and, on update, already be) controlled by the ManagedSecret of the same name (' + request.name + ')'"
    # The spec is exactly desiredVaultStaticSecretSpec: read kv/<namespace>/<name>
    # with the namespace's own vault-reader VaultAuth into a Secret of the same
    # name that VSO creates and never takes over (overwrite false). None of the
    # other VSO 1.6.2 fields: no rollout restarts (they would let a secret
    # restart arbitrary workloads), Vault namespace, version pin, transformation,
    # extra labels or annotations, Secret type or event sync.
    - expression: >-
        !variables.isVSS || request.operation == 'DELETE' ||
        (has(object.spec) && has(object.spec.destination) &&
         object.spec.?vaultAuthRef.orValue('') == 'vault-reader' &&
         object.spec.?mount.orValue('') == 'kv' &&
         object.spec.?type.orValue('') == 'kv-v2' &&
         object.spec.?path.orValue('') == request.namespace + '/' + object.metadata.name &&
         object.spec.?refreshAfter.orValue('') == '60s' &&
         object.spec.?hmacSecretData.orValue(true) == true &&
         object.spec.destination.?name.orValue('') == object.metadata.name &&
         object.spec.destination.?create.orValue(false) == true &&
         object.spec.destination.?overwrite.orValue(false) == false &&
         !has(object.spec.destination.type) && !has(object.spec.destination.annotations) &&
         !has(object.spec.destination.labels) && !has(object.spec.destination.transformation) &&
         !has(object.spec.namespace) && !has(object.spec.version) &&
         !has(object.spec.rolloutRestartTargets) && !has(object.spec.syncConfig))
      reason: Forbidden
      message: "idp-operator VaultStaticSecrets must match the operator's fixed spec (vaultAuthRef vault-reader, kv-v2 mount kv, path <namespace>/<name>, refreshAfter 60s, destination <name> with create true and overwrite false, no other fields)"
    # WorkloadIdentity children are named after it, so, as for VaultStaticSecrets,
    # they must be controlled by the WorkloadIdentity of the same name (one
    # ownerReference, controller=true), and on UPDATE the stored object must
    # already be: a ServiceAccount, VaultAuth, HTTPRoute or AuthorizationPolicy
    # made by hand or by another controller can never be adopted. Subresource
    # writes (serviceaccounts/token) carry no such owner and are refused. The
    # policy cannot look the WorkloadIdentity up; a made-up owner UID is removed
    # by the garbage collector.
    - expression: >-
        !variables.isWI ||
        (request.operation == 'DELETE' ? [oldObject] : request.operation == 'UPDATE' ? [object, oldObject] : [object]).all(v,
          has(v.metadata.ownerReferences) && size(v.metadata.ownerReferences) == 1 &&
          v.metadata.ownerReferences.all(o,
            o.apiVersion == 'idp.ithaca-idp.com/v1alpha1' && o.kind == 'WorkloadIdentity' &&
            o.name == v.metadata.name && o.?controller.orValue(false) == true))
      reason: Forbidden
      messageExpression: "'idp-operator ' + request.resource.resource + ' must be (and, on update, already be) controlled by the WorkloadIdentity of the same name (' + request.name + ')'"
    # Mirrors the WorkloadIdentity CRD name rules, so a made-up owner cannot
    # carry a name the CRD would refuse (default, kube-*, ...).
    - expression: >-
        !variables.isWI ||
        (request.name.size() <= 40 && request.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') &&
         !(request.name in ['vault-reader', 'default']) &&
         !['default-token', 'vault-reader-token', 'sh-helm', 'kube-', 'istio-', 'idp-'].exists(p, request.name.startsWith(p)))
      reason: Forbidden
      messageExpression: "'idp-operator may not write ' + request.resource.resource + ' named ' + request.name + ' (not a valid WorkloadIdentity name)'"
    # WorkloadIdentity children carry no annotations at all (the allowlist is
    # empty): Istio reads behaviour from annotations, e.g. istio.io/dry-run turns
    # an AuthorizationPolicy into log-only. The controller drops any it finds.
    - expression: >-
        !variables.isWI || request.operation == 'DELETE' ||
        size(object.metadata.?annotations.orValue({})) == 0
      reason: Forbidden
      messageExpression: "'idp-operator ' + request.resource.resource + ' for WorkloadIdentities may not carry annotations (' + request.name + ')'"
    # The workload ServiceAccount carries nothing but automountServiceAccountToken
    # false: no token or image pull Secrets.
    - expression: >-
        request.resource.resource != 'serviceaccounts' || !variables.isWI || request.operation == 'DELETE' ||
        (object.?automountServiceAccountToken.orValue(true) == false &&
         !has(object.secrets) && !has(object.imagePullSecrets))
      reason: Forbidden
      message: "idp-operator workload ServiceAccounts must set automountServiceAccountToken false and carry no secrets or imagePullSecrets"
    # The HTTPRoute is exactly desiredHTTPRouteSpec in substance: one parentRef,
    # the https listener of Gateway istio-ingress/ingress; one hostname
    # <name>.<namespace>.apps.ithaca-idp.com (the operator flag
    # --workload-hostname-suffix must match; change both together); and exactly
    # one rule, with no filters (no redirect or rewrite) and exactly one
    # backendRef: group core, kind Service, name = the HTTPRoute's own name
    # (the workload), port 80, no namespace (same namespace), so a route can
    # only forward to the Service of its own workload. Field names are those of
    # Gateway API v1 (standard channel) HTTPRoute.
    - expression: >-
        request.resource.resource != 'httproutes' || request.operation == 'DELETE' ||
        (has(object.spec) && has(object.spec.parentRefs) && size(object.spec.parentRefs) == 1 &&
         object.spec.parentRefs.all(p,
           p.?group.orValue('gateway.networking.k8s.io') == 'gateway.networking.k8s.io' &&
           p.?kind.orValue('Gateway') == 'Gateway' &&
           p.?namespace.orValue('') == 'istio-ingress' && p.name == 'ingress' &&
           p.?sectionName.orValue('') == 'https' && !has(p.port)) &&
         object.spec.?hostnames.orValue([]) == [object.metadata.name + '.' + request.namespace + '.apps.ithaca-idp.com'] &&
         has(object.spec.rules) && size(object.spec.rules) == 1 &&
         object.spec.rules.all(r, !has(r.filters) &&
           has(r.backendRefs) && size(r.backendRefs) == 1 &&
           r.backendRefs.all(b, b.?group.orValue('') == '' && b.?kind.orValue('Service') == 'Service' &&
             b.name == object.metadata.name && !has(b.namespace) && b.?port.orValue(0) == 80 &&
             !has(b.filters))))
      reason: Forbidden
      message: "idp-operator HTTPRoutes must attach only to istio-ingress/ingress section https, carry exactly the hostname <name>.<namespace>.apps.ithaca-idp.com, and have one rule with no filters and one backendRef to the Service <name> (core, port 80, same namespace)"
    # The AuthorizationPolicy is exactly desiredAuthorizationPolicySpec: ALLOW for
    # pods labelled idp.ithaca-idp.com/workload=<name>, one rule whose two
    # sources are the request namespace and the principal
    # <trust domain>/ns/istio-ingress/sa/ingress-istio; no targetRefs, provider,
    # to, when or other source fields (an empty source would match everyone).
    # Field names follow the Istio 1.27 AuthorizationPolicy CRD.
    - expression: >-
        request.resource.resource != 'authorizationpolicies' || request.operation == 'DELETE' ||
        (has(object.spec) && object.spec.?action.orValue('') == 'ALLOW' &&
         !has(object.spec.provider) && !has(object.spec.targetRef) && !has(object.spec.targetRefs) &&
         has(object.spec.selector) &&
         object.spec.selector.?matchLabels.orValue({}) == {'idp.ithaca-idp.com/workload': object.metadata.name} &&
         has(object.spec.rules) && size(object.spec.rules) == 1 &&
         object.spec.rules.all(r, !has(r.to) && !has(r.when) && has(r.from) && size(r.from) == 2 &&
           r.from.all(f, has(f.source) &&
             !has(f.source.ipBlocks) && !has(f.source.notIpBlocks) &&
             !has(f.source.remoteIpBlocks) && !has(f.source.notRemoteIpBlocks) &&
             !has(f.source.notNamespaces) && !has(f.source.notPrincipals) &&
             !has(f.source.requestPrincipals) && !has(f.source.notRequestPrincipals) &&
             !has(f.source.serviceAccounts) && !has(f.source.notServiceAccounts)) &&
           r.from[0].source.?namespaces.orValue([]) == [request.namespace] && !has(r.from[0].source.principals) &&
           !has(r.from[1].source.namespaces) && size(r.from[1].source.?principals.orValue([])) == 1 &&
           r.from[1].source.principals.all(p,
             p.matches('^[a-z0-9]([-a-z0-9.]*[a-z0-9])?/ns/istio-ingress/sa/ingress-istio$'))))
      reason: Forbidden
      message: "idp-operator AuthorizationPolicies must match the operator's fixed spec (ALLOW for pods labelled idp.ithaca-idp.com/workload=<name> from the same namespace and the ingress gateway principal only)"
    # idp-allow-ingress-gateway is exactly desiredAllowIngressGatewaySpec: all
    # pods, Ingress, one rule with ONE peer holding both selectors (namespace
    # istio-ingress AND pods gateway-name=ingress), only TCP 15008 (HBONE). An extra peer, an
    # empty peer (allow all), an ipBlock or any other selector is denied. The
    # literals are the --gateway-namespace/--gateway-name defaults; change both
    # together. The other two managed policies are pinned below.
    - expression: >-
        request.resource.resource != 'networkpolicies' || request.operation == 'DELETE' ||
        request.name != 'idp-allow-ingress-gateway' ||
        (has(object.spec) && size(object.spec.?podSelector.orValue({})) == 0 &&
         object.spec.?policyTypes.orValue([]) == ['Ingress'] && !has(object.spec.egress) &&
         has(object.spec.ingress) && size(object.spec.ingress) == 1 &&
         object.spec.ingress.all(r, has(r.ports) && size(r.ports) == 1 &&
           r.ports.all(p, p.?protocol.orValue('') == 'TCP' && p.?port.orValue(0) == 15008 && !has(p.endPort)) && has(r.from) && size(r.from) == 1 &&
           r.from.all(f, !has(f.ipBlock) &&
             has(f.namespaceSelector) && !has(f.namespaceSelector.matchExpressions) &&
             f.namespaceSelector.?matchLabels.orValue({}) == {'kubernetes.io/metadata.name': 'istio-ingress'} &&
             has(f.podSelector) && !has(f.podSelector.matchExpressions) &&
             f.podSelector.?matchLabels.orValue({}) == {'gateway.networking.k8s.io/gateway-name': 'ingress'})))
      reason: Forbidden
      message: "idp-operator may write idp-allow-ingress-gateway only as: all pods, Ingress, one peer admitting pods labelled gateway.networking.k8s.io/gateway-name=ingress in namespace istio-ingress, only TCP 15008"
    # idp-default-deny-ingress is exactly desiredDenyIngressSpec: all pods,
    # Ingress, no ingress rule at all and no egress. Any rule would open ingress
    # and break tenant isolation.
    - expression: >-
        request.resource.resource != 'networkpolicies' || request.operation == 'DELETE' ||
        request.name != 'idp-default-deny-ingress' ||
        (has(object.spec) && size(object.spec.?podSelector.orValue({})) == 0 &&
         object.spec.?policyTypes.orValue([]) == ['Ingress'] && !has(object.spec.egress) &&
         size(object.spec.?ingress.orValue([])) == 0)
      reason: Forbidden
      message: "idp-operator may write idp-default-deny-ingress only as: all pods, Ingress, no ingress rules, no egress"
    # idp-allow-same-namespace is exactly desiredSameNamespaceSpec: all pods,
    # Ingress, one rule with no ports and ONE peer that is an empty podSelector
    # (pods of this namespace only; no namespaceSelector, which would reach other
    # namespaces, and no ipBlock). An empty rule or peer (allow all) is denied.
    - expression: >-
        request.resource.resource != 'networkpolicies' || request.operation == 'DELETE' ||
        request.name != 'idp-allow-same-namespace' ||
        (has(object.spec) && size(object.spec.?podSelector.orValue({})) == 0 &&
         object.spec.?policyTypes.orValue([]) == ['Ingress'] && !has(object.spec.egress) &&
         has(object.spec.ingress) && size(object.spec.ingress) == 1 &&
         object.spec.ingress.all(r, size(r.?ports.orValue([])) == 0 && has(r.from) && size(r.from) == 1 &&
           r.from.all(f, !has(f.ipBlock) && !has(f.namespaceSelector) &&
             has(f.podSelector) && size(f.?podSelector.orValue({})) == 0)))
      reason: Forbidden
      message: "idp-operator may write idp-allow-same-namespace only as: all pods, Ingress, one rule with one peer that is an empty podSelector (same namespace), no ports"
    # Metadata of the three managed NetworkPolicies (childLabels(): managed-by and
    # team-namespace only). CREATE: exactly those labels, no annotations. UPDATE:
    # labels and annotations unchanged, except that labels may be reset to exactly
    # the child labels (drift repair); no annotation can be added.
    - expression: >-
        request.resource.resource != 'networkpolicies' || request.operation == 'DELETE' ||
        (object.metadata.?labels.orValue({}) == {'app.kubernetes.io/managed-by': 'idp-operator', 'idp.ithaca-idp.com/team-namespace': request.namespace} ||
         (request.operation == 'UPDATE' && object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({}))) &&
        (request.operation == 'CREATE' ? size(object.metadata.?annotations.orValue({})) == 0 :
         object.metadata.?annotations.orValue({}) == oldObject.metadata.?annotations.orValue({}))
      reason: Forbidden
      message: "idp-operator NetworkPolicy metadata: labels must be the managed-by and team-namespace child labels (or unchanged on update) and annotations none (unchanged on update)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: idp-operator-scope
spec:
  policyName: idp-operator-scope
  validationActions: ["Deny"]

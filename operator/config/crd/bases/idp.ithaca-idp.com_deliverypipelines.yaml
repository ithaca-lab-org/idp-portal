---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: deliverypipelines.idp.ithaca-idp.com
spec:
  group: idp.ithaca-idp.com
  names:
    kind: DeliveryPipeline
    listKind: DeliveryPipelineList
    plural: deliverypipelines
    shortNames:
    - dpipe
    singular: deliverypipeline
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workload
      name: Workload
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.applicationName
      name: Application
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DeliveryPipeline asks the delivery controller (idp-delivery, a separate
          Deployment, the only caller of Spinnaker's Gate; ADR 0011) for a Spinnaker
          application <namespace>-<workload> with one pipeline "deploy": bake the
          Kustomize base of the repository at a given commit, then deploy the result
          into the namespace through the Clouddriver account of the same name. The
          pipeline JSON comes from a template inside the controller; tenants never edit
          it. The object must be named after its workload (one pipeline per workload).

          Written by portal-api only (admission policy idp-delivery-scope). Deleting it
          does NOT delete the Spinnaker application or pipeline (follow-up).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              path:
                default: deploy/base
                description: 'Path is the Kustomize directory inside the repository:
                  relative, no "..".'
                maxLength: 128
                pattern: ^[A-Za-z0-9._][A-Za-z0-9._/-]*$
                type: string
                x-kubernetes-validations:
                - message: path must be relative, without '..', '//' or a trailing
                    '/'
                  rule: '!self.contains(''..'') && !self.contains(''//'') && !self.endsWith(''/'')'
              repo:
                description: |-
                  Repo is the GitHub repository holding the Kustomize base, in the form
                  https://github.com/<org>/<repo> (no trailing slash, no .git). The
                  controller only accepts organisations on its allowlist
                  (DELIVERY_ALLOWED_REPO_ORGS).
                maxLength: 200
                pattern: ^https://github\.com/[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}$
                type: string
              workload:
                description: |-
                  Workload is the name of a WorkloadIdentity in the same namespace. The
                  pipeline deploys as that workload (ServiceAccount and pod label).
                maxLength: 40
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
            required:
            - repo
            - workload
            type: object
          status:
            properties:
              applicationName:
                description: ApplicationName is the Spinnaker application, <namespace>-<workload>.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              message:
                description: 'Message is short and sanitised: never a raw Gate response.'
                maxLength: 300
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                enum:
                - PENDING
                - BUILDING
                - READY
                - FAILED
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must equal spec.workload
          rule: self.metadata.name == self.spec.workload
        - message: spec.workload is immutable
          rule: self.spec.workload == oldSelf.spec.workload
    served: true
    storage: true
    subresources:
      status: {}

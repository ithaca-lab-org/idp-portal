---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: resourcegrants.idp.ithaca-idp.com
spec:
  group: idp.ithaca-idp.com
  names:
    kind: ResourceGrant
    listKind: ResourceGrantList
    plural: resourcegrants
    shortNames:
    - rgrant
    singular: resourcegrant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.workload
      name: Workload
      type: string
    - jsonPath: .spec.resource
      name: Resource
      type: string
    - jsonPath: .spec.access
      name: Access
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ResourceGrant gives the workload spec.workload (its WorkloadIdentity
          ServiceAccount, as a direct principal:// IAM member, no key and no Google
          service account) reader or writer access to the bucket of the BucketClaim
          spec.resource in the same namespace (ADR 0010). The broker keeps the bucket's
          IAM bindings for that namespace equal to the set of all non-terminating
          grants of the claim; it touches no other binding. Deleting the grant removes
          the binding.

          The spec is immutable (workload, resource, access): delete and re-create to
          change it. metadata.name is free (DNS-1123 label, at most 63 characters).

          Status: Ready=True (reason Bound) means the binding is in place. Ready=False
          reasons: NotManaged (the namespace is not managed), WorkloadNotFound,
          ClaimNotFound, ClaimNotReady (including a bucket the claim does not own),
          GrantFailed (the IAM call failed).
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'ResourceGrantSpec is immutable: a change means delete and
              re-create.'
            properties:
              access:
                description: 'Access is the fixed menu entry: reader or writer.'
                enum:
                - reader
                - writer
                type: string
                x-kubernetes-validations:
                - message: access is immutable
                  rule: self == oldSelf
              resource:
                description: Resource is the name of a BucketClaim in the same namespace.
                maxLength: 18
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: resource is immutable
                  rule: self == oldSelf
                - message: resource must be a DNS-1123 label
                  rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
              workload:
                description: |-
                  Workload is the name of a WorkloadIdentity in the same namespace; its
                  ServiceAccount is the principal that gets access. Same rules as a
                  WorkloadIdentity name.
                maxLength: 40
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: workload is immutable
                  rule: self == oldSelf
                - message: workload must be a DNS-1123 label
                  rule: self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
                - message: workload name is reserved
                  rule: '!(self in [''vault-reader'', ''default'']) && ![''default-token'',
                    ''vault-reader-token'', ''sh-helm'', ''kube-'', ''istio-'', ''idp-''].exists(p,
                    self.startsWith(p))'
            required:
            - access
            - resource
            - workload
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              member:
                description: |-
                  Member is the IAM principal the grant binds, informational:
                  principal://iam.googleapis.com/projects/<number>/locations/global/workloadIdentityPools/<project>.svc.id.goog/subject/ns/<namespace>/sa/<workload>.
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be at most 63 characters
          rule: self.metadata.name.size() <= 63
        - message: name must be a DNS-1123 label
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}

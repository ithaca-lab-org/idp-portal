# Test-only stand-in for the Vault Secrets Operator VaultAuth CRD (VSO 1.6.2,
# secrets.hashicorp.com/v1beta1), written for envtest. It types only the fields
# the operator sets (plus the other top-level spec fields, loosely), with the
# same names, types and defaults as upstream; unknown fields are pruned, so a
# misspelt field fails the tests. The real CRD is
# installed on the cluster by the VSO chart (idp-gitops), not from here.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultauths.secrets.hashicorp.com
spec:
  group: secrets.hashicorp.com
  names:
    kind: VaultAuth
    listKind: VaultAuthList
    plural: vaultauths
    singular: vaultauth
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                method:
                  type: string
                  enum: [kubernetes, jwt, appRole, aws, gcp]
                mount:
                  type: string
                namespace:
                  type: string
                vaultConnectionRef:
                  type: string
                allowedNamespaces:
                  type: array
                  items:
                    type: string
                headers:
                  type: object
                  additionalProperties:
                    type: string
                params:
                  type: object
                  additionalProperties:
                    type: string
                # Other auth methods and options: present so the admission policy
                # type-checks the same field names as against the real CRD.
                appRole:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                aws:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                gcp:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                jwt:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                storageEncryption:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                vaultAuthGlobalRef:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                kubernetes:
                  type: object
                  properties:
                    role:
                      type: string
                    serviceAccount:
                      type: string
                    audiences:
                      type: array
                      items:
                        type: string
                    tokenExpirationSeconds:
                      type: integer
                      format: int64
                      minimum: 600
                      default: 600
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

# Test-only stand-in for the Vault Secrets Operator VaultStaticSecret CRD (VSO
# 1.6.2, secrets.hashicorp.com/v1beta1), written for envtest like the VaultAuth
# stub next to it. It types the fields the operator sets with the same names,
# types, required lists and defaults as upstream (hmacSecretData defaults to
# true, destination.create and destination.overwrite to false) and lists the
# other 1.6.2 spec fields loosely, so the admission policy type-checks the same
# field set as against the real CRD. Unknown fields are pruned, so a misspelt
# field fails the tests. The real CRD is installed by the VSO chart (idp-gitops).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vaultstaticsecrets.secrets.hashicorp.com
spec:
  group: secrets.hashicorp.com
  names:
    kind: VaultStaticSecret
    listKind: VaultStaticSecretList
    plural: vaultstaticsecrets
    singular: vaultstaticsecret
  scope: Namespaced
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [destination, mount, path, type]
              properties:
                vaultAuthRef:
                  type: string
                mount:
                  type: string
                namespace:
                  type: string
                path:
                  type: string
                type:
                  type: string
                  enum: [kv-v1, kv-v2]
                version:
                  type: integer
                  minimum: 0
                refreshAfter:
                  type: string
                  pattern: ^([0-9]+(\.[0-9]+)?(s|m|h))$
                hmacSecretData:
                  type: boolean
                  default: true
                destination:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    create:
                      type: boolean
                      default: false
                    overwrite:
                      type: boolean
                      default: false
                    type:
                      type: string
                    annotations:
                      type: object
                      additionalProperties:
                        type: string
                    labels:
                      type: object
                      additionalProperties:
                        type: string
                    transformation:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                rolloutRestartTargets:
                  type: array
                  items:
                    type: object
                    required: [kind, name]
                    properties:
                      kind:
                        type: string
                        enum: [Deployment, DaemonSet, StatefulSet, argo.Rollout]
                      name:
                        type: string
                syncConfig:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
